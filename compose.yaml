# Local development database. Start with `podman compose up -d`.
name: for-wealth
services:
  db:
    # Fully qualified: Podman's short-name mode refuses to pick a registry
    # when compose runs without a terminal.
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: for_wealth
      POSTGRES_PASSWORD: for_wealth # local only; the port is bound to localhost
      POSTGRES_DB: for_wealth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the
      # volume mounts the parent, not the old .../data path.
      - pgdata:/var/lib/postgresql
      # Runs only on first start, when the volume is empty. :Z relabels the
      # bind mount for SELinux.
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U for_wealth -d for_wealth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
